name: omnicopter-slam
services:
  simulator:
    build:
      context: .
      args:
        BUILD_JOBS: "${BUILD_JOBS:-2}"
    image: omnicopter-slam:local
    init: true
    shm_size: 1gb
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    environment:
      OMNI_DATABASE: /home/omni/.ros/omnicopter.db
    volumes:
      - maps:/home/omni/.ros
      - gazebo:/home/omni/.gazebo
volumes:
  maps:
  gazebo:
